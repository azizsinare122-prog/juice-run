<!DOCTYPE html>

<style>
:root{--ink:#12324a;--panel:#ffffff;--accent:#ff7a2f}
@media (prefers-color-scheme:dark){:root{--ink:#e8f6ff;--panel:#16344a}}
html,body{margin:0;height:100%;overflow:hidden;background:#73c9ff;touch-action:none;font-family:system-ui,-apple-system,Roboto,sans-serif;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}

.row,.row2{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.chip{background:rgba(10,40,70,.62);color:#fff;font-weight:800;font-size:14px;padding:6px 11px;border-radius:14px;white-space:nowrap}
.bar{flex:1;height:12px;background:rgba(255,255,255,.55);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd21e,#ff7a2f)}
.ib{pointer-events:auto;border:0;background:rgba(10,40,70,.62);color:#fff;font-size:16px;min-width:34px;height:34px;border-radius:12px;padding:0 4px}
#big{position:fixed;left:0;right:0;top:26%;text-align:center;font-size:52px;font-weight:900;color:#fff;text-shadow:0 3px 0 #0a4a78,0 0 14px rgba(0,0,0,.35);pointer-events:none;opacity:0}
#big.go{animation:bg 1.1s ease-out}
@keyframes bg{0%{opacity:0;transform:scale(.4)}25%{opacity:1;transform:scale(1.15)}70%{opacity:1}100%{opacity:0;transform:scale(1)}}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0}
#flash.go{animation:fl .5s ease-out}
@keyframes fl{0%{opacity:.5}100%{opacity:0}}
.pop{position:fixed;transform:translate(-50%,-50%);font-weight:900;font-size:30px;pointer-events:none;text-shadow:0 2px 0 rgba(0,0,0,.35);animation:up .9s ease-out forwards}
.pop.g{color:#7dff8a}.pop.b{color:#ff5b5b}
@keyframes up{0%{opacity:0;margin-top:0}15%{opacity:1}100%{opacity:0;margin-top:-90px}}
#panel{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,30,55,.45);padding:20px}
#panel.show{display:flex}
.card{background:var(--panel);color:var(--ink);border-radius:24px;padding:20px;max-width:340px;width:100%;max-height:88vh;overflow-y:auto;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.card h2{margin:0 0 8px;font-size:25px}.card h3{margin:12px 0 2px;font-size:15px;opacity:.75}.card p{margin:6px 0 12px;font-size:15px;line-height:1.4}
.st{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid rgba(120,150,180,.3);font-size:15px;text-align:left}
.st b{font-weight:700;display:flex;align-items:center;gap:8px}
.btn{display:block;width:100%;border:0;border-radius:16px;background:var(--accent);color:#fff;font-size:19px;font-weight:900;padding:13px;margin-top:10px;box-shadow:0 4px 0 #c9561a}
.btn.s{background:#3a9fe0;box-shadow:0 4px 0 #2272a8}

.hs{font-size:20px;font-weight:800}.hs2{font-size:16px;font-weight:800;opacity:.9}
.bp{width:calc(100% - 40px);margin:0 20px;font-size:34px;padding:22px}

#strip::-webkit-scrollbar{display:none}

.ht2{font-size:30px;font-weight:900;text-shadow:0 3px 0 #0a4aa8}
.li{flex:0 0 auto;width:64px;text-align:center}
.lc{width:56px;height:56px;border-radius:50%;border:4px solid rgba(255,255,255,.55);background:#2a7fe0;color:#fff;font-size:22px;font-weight:900}
.lc.on{border-color:#fff;background:#ff7a2f;box-shadow:0 0 0 4px rgba(255,255,255,.5);transform:scale(1.12)}
.lc.lk{background:#5a7fa8;opacity:.8}
.stars{font-size:13px;color:#ffd21e;margin-top:4px;letter-spacing:1px;height:16px}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud">
 <div class="row"><div class="chip" id="lv">NIV 1</div><div class="bar"><i id="bar"></i></div>
  <button class="ib" id="hl" data-act="land">🏝️</button><button class="ib" data-act="shop">🛍️</button><button class="ib" data-act="set">⚙️</button><button class="ib" data-act="pause">❚❚</button></div>
 <div class="row2"><div class="chip" id="cur">FRAISE</div><div class="chip" id="jc">🥤 0 ml</div><div class="chip" id="sc">💎 0</div></div>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const LANES=[-1.4,0,1.4],GLASS_ML=40,MAXL=100,SP=2;

/* ---------- Sauvegarde ---------- */
let SAVE={gems:0,own:['p0','s0'],p:0,s:0,lvl:0,spd:1,music:true,stars:[],theme:0,song:0};
try{Object.assign(SAVE,JSON.parse(localStorage.getItem('jr3')||'{}'));}catch(e){}
const persist=()=>{try{localStorage.setItem('jr3',JSON.stringify(SAVE));}catch(e){}};

/* ---------- Rendu ---------- */
let renderer;
try{renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});}
catch(err){$('panel').className='show';$('panel').innerHTML='<div class="card"><h2>Appareil non compatible</h2><p>Ce téléphone ne peut pas démarrer le rendu 3D WebGL nécessaire à Juice Run 3D. Essaie avec un navigateur récent et vérifie que l’accélération graphique est disponible.</p></div>';return;}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
const scene=new THREE.Scene();scene.background=new THREE.Color(0x73c9ff);scene.fog=new THREE.Fog(0x9fdcff,35,115);
const cam=new THREE.PerspectiveCamera(58,1,.1,200),look=new THREE.Vector3(),camP=new THREE.Vector3(),camL=new THREE.Vector3();
function resize(){renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
scene.add(new THREE.HemisphereLight(0xffffff,0xf1dca0,.95));
const sun=new THREE.DirectionalLight(0xffffff,.6);sun.position.set(6,14,8);scene.add(sun);
const lam=c=>new THREE.MeshLambertMaterial({color:c}),mVC=new THREE.MeshLambertMaterial({vertexColors:true});
const M4=(x,y,z,rx=0,ry=0,rz=0,sx=1,sy=1,sz=1)=>new THREE.Matrix4().compose(new THREE.Vector3(x,y,z),new THREE.Quaternion().setFromEuler(new THREE.Euler(rx,ry,rz,'YXZ')),new THREE.Vector3(sx,sy,sz));

    for(let i=0;i<p.length;i++){P.push(p[i]);N.push(n[i]);}for(let i=0;i<p.length/3;i++)C.push(col.r,col.g,col.b);});
  const o=new THREE.BufferGeometry();o.setAttribute('position',new THREE.Float32BufferAttribute(P,3));o.setAttribute('normal',new THREE.Float32BufferAttribute(N,3));o.setAttribute('color',new THREE.Float32BufferAttribute(C,3));return o;}
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ---------- Verres ---------- */
const gBase=new THREE.CylinderGeometry(.43,.43,.1,16),gEye=new THREE.SphereGeometry(.12,10,8),gPupil=new THREE.SphereGeometry(.06,8,6),
gMouth=new THREE.TorusGeometry(.12,.025,6,12,Math.PI),gSV=new THREE.CylinderGeometry(.045,.045,.75,6),gSH=new THREE.CylinderGeometry(.045,.045,.32,6);
function cupGeo(c,sh){
  sh=sh||0;const R=[.43,.4,.58][sh],MZ=[.44,.34,.59][sh],T=[1.6,1.85,1.3][sh],yel=c===0xffd21e;let p;
  if(sh===1)p=[[new THREE.CylinderGeometry(.55,.2,1.3,16),c,M4(0,1.2,0)],[new THREE.CylinderGeometry(.05,.05,.45,8),0xdfeefa,M4(0,.33,0)],[new THREE.CylinderGeometry(.32,.32,.05,16),0xdfeefa,M4(0,.03,0)]];
  else if(sh===2)p=[[new THREE.CylinderGeometry(.6,.55,1.2,16),c,M4(0,.7,0)],[gBase,0xdfeefa,M4(0,.05,0)]];
  else p=[[new THREE.CylinderGeometry(.45,.4,1.5,16),c,M4(0,.85,0)],[gBase,0xdfeefa,M4(0,.05,0)]];
  p.push([gMouth,0x2a2a3a,M4(0,.95,MZ,0,0,Math.PI,1.7,1.4,1)]);
  if(yel)p.push([new THREE.CylinderGeometry(.36,.36,.05,18),0xfff27a,M4(.4,T+.05,0,Math.PI/2,0,.3)],[new THREE.CylinderGeometry(.3,.3,.06,18),0xffe14a,M4(.4,T+.05,.01,Math.PI/2,0,.3)]);
  else p.push([gSV,c,M4(.15,T+.35,0,0,0,-.2,1.3,1.3,1.3)],[gSH,c,M4(0,T+.85,0,0,0,Math.PI/2,1.3,1,1.3)]);
  [-1,1].forEach(s=>p.push([gEye,0xffffff,M4(s*.2,1.25,R-.04,0,0,0,1.4,1.1,.5)],[gPupil,0x222222,M4(s*.2,1.24,R+.04,0,0,0,1.2,1.4,.6)]));
  return merge(p);}
const CUP={};
const PALS=[{c:[0xff3d54,0xffd21e,0x45d65c],n:['FRAISE','CITRON','POMME']},{c:[0xff8a1f,0x8e44ff,0x2ecfc4],n:['ORANGE','RAISIN','MENTHE']},{c:[0x3a6bff,0xff4fa0,0x9be12a],n:['MYRTILLE','FRAMBOISE','KIWI']}];
const ITEMS=[{id:'s0',t:'Verre classique',c:0,k:'s',i:0},{id:'s1',t:'Verre tulipe',c:30,k:'s',i:1},{id:'s2',t:'Verre large',c:50,k:'s',i:2},
 {id:'p0',t:'Fraise · Citron · Pomme',c:0,k:'p',i:0},{id:'p1',t:'Orange · Raisin · Menthe',c:40,k:'p',i:1},{id:'p2',t:'Myrtille · Framboise · Kiwi',c:60,k:'p',i:2}];
// Normaliser les anciennes sauvegardes ou les données locales endommagées.
const intIn=(v,min,max,fallback)=>Number.isFinite(Number(v))?clamp(Math.floor(Number(v)),min,max):fallback;
SAVE.gems=intIn(SAVE.gems,0,999999,0);SAVE.lvl=intIn(SAVE.lvl,0,MAXL-1,0);
SAVE.p=intIn(SAVE.p,0,2,0);SAVE.s=intIn(SAVE.s,0,2,0);
SAVE.theme=intIn(SAVE.theme,0,3,0);SAVE.song=intIn(SAVE.song,0,5,0);SAVE.music=SAVE.music!==false;
SAVE.own=Array.isArray(SAVE.own)?SAVE.own.filter(x=>ITEMS.some(it=>it.id===x)):['p0','s0'];
if(!SAVE.own.includes('p0'))SAVE.own.push('p0');if(!SAVE.own.includes('s0'))SAVE.own.push('s0');
SAVE.stars=Array.isArray(SAVE.stars)?SAVE.stars.slice(0,MAXL).map(v=>intIn(v,0,5,0)):[];
function applyAll(){const P=PALS[SAVE.p]||PALS[0];KEYS.forEach((k,j)=>{COL[k]=P.c[j];NAME[k]=P.n[j];CUP[k]=cupGeo(P.c[j],SAVE.s);});}
applyAll();

/* ---------- Piste sinueuse ---------- */
let PATH={X:[0],Z:[0],T:[0]};const AT={x:0,z:0,t:0};
function mkPath(len,straightFrom,r){
  const X=[0],Z=[0],T=[0];let th=0,x=0,z=0,s=0;
  const seg=(l,k)=>{for(let i=0;i<l;i++){th+=k;x+=Math.sin(th);z-=Math.cos(th);X.push(x);Z.push(z);T.push(th);s++;}};
  seg(26,0);
  while(s<straightFrom){const q=r();let l,k;
    if(q<.3){l=12+Math.floor(r()*14);k=0;}else if(q<.62){l=16+Math.floor(r()*10);k=Math.PI/2/l;}else{l=10+Math.floor(r()*8);k=Math.PI/4/l;}
    let sg=r()<.5?1:-1;if(Math.abs(th+sg*k*l)>1.9)sg=-sg;seg(l,k*sg);}
  if(s<len)seg(len-s,0);PATH={X,Z,T};}
function at(zz){const s=-zz,n=PATH.X.length-1;
  if(s<=0){AT.x=0;AT.z=-s;AT.t=0;}
  else if(s>=n){const d=s-n,t=PATH.T[n];AT.x=PATH.X[n]+Math.sin(t)*d;AT.z=PATH.Z[n]-Math.cos(t)*d;AT.t=t;}
  else{const i=s|0,f=s-i,X=PATH.X,Z=PATH.Z,T=PATH.T;AT.x=X[i]+(X[i+1]-X[i])*f;AT.z=Z[i]+(Z[i+1]-Z[i])*f;AT.t=T[i]+(T[i+1]-T[i])*f;}
  return AT;}
function put(m,zz,lat,y){const a=at(zz);m.position.set(a.x+Math.cos(a.t)*lat,y,a.z+Math.sin(a.t)*lat);m.rotation.y=-a.t;return a.t;}
const wv=(zz,lat,y)=>{const a=at(zz);return new THREE.Vector3(a.x+Math.cos(a.t)*lat,y,a.z+Math.sin(a.t)*lat);};

/* ---------- Décor fixe ---------- */
const THEMES=[{id:'beach',n:'Plage',e:'🏝️',sky:0x73c9ff,fog:0x9fdcff,gr:0xf6d98b,edge:0x7fd0f4,sun:0xffe14a,car:0xcfe9ff},
 {id:'jungle',n:'Jungle',e:'🐒',sky:0x8ad8c0,fog:0xa8e6cc,gr:0x3f9a4a,edge:0x5c3a1e,sun:0xfff2a0,car:0xc9a06a},
 {id:'pole',n:'Pôle Nord',e:'🐧',sky:0xbfe3ff,fog:0xe4f3ff,gr:0xf2f9ff,edge:0x8fd0ff,sun:0xfff7d6,car:0xdff6ff},
 {id:'city',n:'Centre-ville',e:'🏙️',sky:0x8fc3f5,fog:0xbcd2e6,gr:0x707884,edge:0xeeeeee,sun:0xffd36b,car:0x8a929e}];
function drawTrk(t,id){
  if(id==='beach'){t.fillStyle='#fff';t.fillRect(0,0,128,128);t.fillStyle='#e3f5ff';t.fillRect(0,0,128,64);t.fillStyle='#7fd0f4';t.fillRect(0,0,8,128);t.fillRect(120,0,8,128);t.fillStyle='#bfe6fa';t.fillRect(42,0,2,128);t.fillRect(84,0,2,128);}
  else if(id==='jungle'){t.fillStyle='#b07a45';t.fillRect(0,0,128,128);for(let y=0;y<128;y+=16){t.fillStyle='#6b4423';t.fillRect(0,y,128,2);t.fillStyle='rgba(60,30,10,.18)';t.fillRect(0,y+5,128,2);t.fillStyle='#6b4423';t.fillRect(((y/16)%2)*64+20,y,2,16);}t.fillStyle='#7a4e28';t.fillRect(0,0,8,128);t.fillRect(120,0,8,128);}
  else if(id==='pole'){t.fillStyle='#d4f1ff';t.fillRect(0,0,128,128);t.fillStyle='#eaf9ff';t.fillRect(0,0,128,64);t.strokeStyle='#ffffff';t.lineWidth=2;[[10,0,60,50],[60,50,40,128],[90,0,120,70],[0,90,50,110]].forEach(([a,b,c,d])=>{t.beginPath();t.moveTo(a,b);t.lineTo(c,d);t.stroke();});t.fillStyle='#9fd8ff';t.fillRect(0,0,8,128);t.fillRect(120,0,8,128);}
  else{t.fillStyle='#59606b';t.fillRect(0,0,128,128);t.fillStyle='#e8e8e8';t.fillRect(0,0,6,128);t.fillRect(122,0,6,128);t.fillStyle='#ffd21e';t.fillRect(42,0,3,64);t.fillRect(84,0,3,64);}}
const TRK=THEMES.map(th=>{const c=document.createElement('canvas');c.width=c.height=128;drawTrk(c.getContext('2d'),th.id);const tx=new THREE.CanvasTexture(c);tx.wrapT=THREE.RepeatWrapping;return new THREE.MeshLambertMaterial({map:tx});});
let TH=THEMES[0],mTrack=TRK[0];const mEdge=lam(0x7fd0f4);
const sand=new THREE.Mesh(new THREE.PlaneGeometry(500,500),lam(0xf6d98b));sand.rotation.x=-Math.PI/2;sand.position.y=-.06;scene.add(sand);
const sky=new THREE.Group();scene.add(sky);
const mSun=new THREE.MeshBasicMaterial({color:0xffe14a,fog:false}),mHalo=new THREE.MeshBasicMaterial({color:0xffe14a,fog:false,transparent:true,opacity:.28}),mCloud=new THREE.MeshBasicMaterial({color:0xffffff,fog:false});
{const sn=new THREE.Mesh(new THREE.SphereGeometry(7,16,12),mSun),h=new THREE.Mesh(new THREE.SphereGeometry(12,16,12),mHalo);sn.position.set(-30,44,-150);h.position.copy(sn.position);sky.add(sn,h);}
const clouds=[],gCl=new THREE.SphereGeometry(1,10,8);
for(let i=0;i<8;i++){const c=new THREE.Group();[[0,0,0,7],[7,-1,1,5.5],[-7,-1,1,5.5],[3,2.5,0,5]].forEach(([x,y,z,r])=>{const m=new THREE.Mesh(gCl,mCloud);m.position.set(x,y,z);m.scale.set(r,r*.65,r*.8);c.add(m);});c.position.set(-110+i*30,30+(i%3)*9,-100-(i%2)*45);sky.add(c);clouds.push(c);}
function applyTheme(){TH=THEMES[SAVE.theme]||THEMES[0];scene.background.setHex(TH.sky);scene.fog.color.setHex(TH.fog);sand.material.color.setHex(TH.gr);mTrack=TRK[THEMES.indexOf(TH)];mEdge.color.setHex(TH.edge);mSun.color.setHex(TH.sun);mHalo.color.setHex(TH.sun);}
const gT=new THREE.CylinderGeometry(.12,.18,4.2,6),gL=new THREE.BoxGeometry(.8,.05,2.4).translate(0,0,1.2),gPole=new THREE.CylinderGeometry(.04,.04,2.2,6),gTop=new THREE.ConeGeometry(1.3,.55,12),gLb=new THREE.BoxGeometry(.7,.12,1.8),gBk=new THREE.BoxGeometry(.7,.12,.7),topC=[0xff3d54,0xffd21e,0x3a9fe0,0xff7a2f];
function ribbon(w,y,zEnd,mat,off){off=off||0;const P=[],U=[],I=[],n=Math.ceil((20-zEnd)/2);
  for(let i=0;i<=n;i++){const z=20-i*2,a=at(z),cx=Math.cos(a.t),sx=Math.sin(a.t),l=off-w/2,r2=off+w/2;
    P.push(a.x+cx*l,y,a.z+sx*l,a.x+cx*r2,y,a.z+sx*r2);U.push(0,(20-z)/4,1,(20-z)/4);if(i<n)I.push(i*2,i*2+1,i*2+2,i*2+1,i*2+3,i*2+2);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(U,2));g.setIndex(I);g.computeVertexNormals();
  const m=new THREE.Mesh(g,mat);m.userData.own=1;lvl.add(m);}
const gTrunk=new THREE.CylinderGeometry(.2,.28,3.2,8),gCan=new THREE.IcosahedronGeometry(1.1,0),gPine1=new THREE.ConeGeometry(1.3,1.6,8),gPine2=new THREE.ConeGeometry(1,1.4,8),gPine3=new THREE.ConeGeometry(.7,1.2,8),gSnow=new THREE.ConeGeometry(.35,.5,8),gIgloo=new THREE.SphereGeometry(1.5,12,8,0,Math.PI*2,0,Math.PI/2),gUnit=new THREE.BoxGeometry(1,1,1),gWin=new THREE.BoxGeometry(.05,.8,.6),gLamp=new THREE.SphereGeometry(.2,8,6);
function buildDecor(L,endZ){
  ribbon(5,0,endZ,mTrack);ribbon(.3,.1,endZ,mEdge,-2.65);ribbon(.3,.1,endZ,mEdge,2.65);
  const rr=rng(L*31+5),parts=[],id=TH.id;
  for(let z=14,i=0;z>endZ;z-=14,i++)[-1,1].forEach(s=>{
    const a=at(z),t=a.t,lat=s*(4.6+rr()*2.2),x=a.x+Math.cos(t)*lat,zz=a.z+Math.sin(t)*lat;

  for(const o of S.obst){
    if(!o.alive||Math.abs(o.z-S.z)>.9||Math.abs(o.x-S.x)>rad+.5)continue;
    o.alive=false;o.m.visible=false;S.power-=1;S.streak=0;S.shake=.4;S.pulse=-.3;const pos=wv(o.z,o.x,1.2);pop('-1',pos,'b');burst(pos,0xff8a3d,10);
    updateHud();if(S.power<=0){die();return;}}
  for(const g of S.gemsArr){if(!g.alive||Math.abs(g.z-S.z)>.8||Math.abs(g.x-S.x)>.9)continue;g.alive=false;g.m.visible=false;S.gems++;burst(wv(g.z,g.x,.8),0xff3fd0,4);}
  for(const g of S.gates){
    if(g.done||Math.abs(g.z-S.z)>1.3)continue;g.done=true;const k=g.perm[S.x<-.7?0:S.x>.7?2:1];

function update(dt){
  S.time+=dt;const st=S.state;
  if(st==='run'){
    if(keys.ArrowLeft||keys.a||keys.q)S.tx=clamp(S.tx-5*dt,-1.9,1.9);

    if(S.state==='run'&&S.z<=S.fin){S.state='toFinish';big('ARRIVÉE !');}
  }else if(st==='toFinish'){
    S.z-=S.spd*dt;S.x+=(0-S.x)*Math.min(1,dt*5);if(S.z<=S.fz+3.2){S.z=S.fz+3.2;startPour();}
  }else if(st==='pour'){
    P.t+=dt;const j=Math.min(P.j,Math.max(P.G-1,0)),side=j%2?1:-1;
    S.z+=(S.fz-(j>>1)*SP-S.z)*Math.min(1,dt*6);S.tilt+=((P.j<P.G?-side*.6:0)-S.tilt)*Math.min(1,dt*8);

  if(st!=='dead'&&st!=='lost'&&st!=='pour')S.scT=.6+Math.min(Math.max(S.power,0),32)*.03;
  S.sc+=(S.scT-S.sc)*Math.min(1,dt*8);S.pulse*=Math.max(0,1-dt*6);
  const a=at(S.z);S.ry+=(-a.t-S.ry)*Math.min(1,dt*10);
  pg.position.set(a.x+Math.cos(a.t)*S.x,st==='run'?Math.abs(Math.sin(S.time*10))*.07:0,a.z+Math.sin(a.t)*S.x);
  pg.scale.setScalar(S.sc*(1+S.pulse));pg.rotation.y=S.ry;pg.rotation.z=S.tilt;
  sand.position.x=pg.position.x;sand.position.z=pg.position.z;
  for(const p of S.pickups){if(!p.alive||Math.abs(p.z-S.z)>70)continue;
    if(p.orb){const q=p.orb.a0+S.time*p.orb.s;p.x=Math.cos(q)*p.orb.R;p.z=p.orb.cz+Math.sin(q)*p.orb.R;p.m.position.set(p.x,.12,p.z-p.orb.cz);}
    else p.m.position.y=Math.sin(S.time*3+p.ph)*.06;}
  for(const p of S.people){animP(p,S.time*(p.fill?9:4)+p.ph,p.fill);if(p.fill&&p.f<1){p.f=Math.min(1,p.f+dt*3);p.ju.scale.y=p.f;p.ju.position.y=.03+.22*p.f;}}
  for(const d of S.deco)if(Math.abs(d.z-S.z)<70)animDeco(d,S.time);
  sky.position.set(pg.position.x,0,pg.position.z);sky.rotation.y=S.ry;for(const c of clouds){c.position.x+=dt*1.5;if(c.position.x>130)c.position.x=-130;}
  if(FW.on){FW.t+=dt;FW.n-=dt;if(FW.n<=0){FW.n=.35+Math.random()*.3;explode(wv(S.z-2-Math.random()*6,(Math.random()-.5)*8,7+Math.random()*5),[0xff3d54,0xffd21e,0x45d65c,0x3a9fe0,0xff4fa0,0xffffff][Math.floor(Math.random()*6)],40);boom();}if(FW.t>7)FW.on=false;}
  for(const p of sparks){if(p.l>0){p.l-=dt;p.v.y-=3*dt;p.v.multiplyScalar(1-dt*.8);p.m.position.addScaledVector(p.v,dt);p.m.scale.setScalar(Math.max(p.l/p.d,.01));if(p.l<=0)p.m.visible=false;}}
  for(const p of parts){if(p.l>0){p.l-=dt;p.v.y-=9*dt;p.m.position.addScaledVector(p.v,dt);p.m.scale.setScalar(Math.max(p.l/.6,.01));if(p.l<=0)p.m.visible=false;}}
  if(RUNS.includes(st))updateHud();}
function placeCam(dt){
  const a=at(S.z+8.5);camP.set(a.x+Math.cos(a.t)*S.x*.5,4.2+S.sc*1.1,a.z+Math.sin(a.t)*S.x*.5);
  const b=at(S.z-6);camL.set(b.x+Math.cos(b.t)*S.x*.35,1.6,b.z+Math.sin(b.t)*S.x*.35);
  const k=Math.min(1,dt*9);cam.position.lerp(camP,k);look.lerp(camL,k);cam.position.x+=(Math.random()-.5)*(S.shake||0);cam.position.y+=(Math.random()-.5)*(S.shake||0);S.shake*=.88;cam.lookAt(look);}

/* ---------- Boucle ---------- */
S.L=Math.min(SAVE.lvl,MAXL-1);build(S.L);startScreen();
let last=performance.now();
function loop(t){requestAnimationFrame(loop);const dt=Math.min((t-last)/1000,.05);last=t;if(!paused)update(dt);placeCam(dt);renderer.render(scene,cam);}
requestAnimationFrame(loop);
})();
